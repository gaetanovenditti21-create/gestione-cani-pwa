<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Cani</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f497d">
</head>
<body>
    <header>
        <h1>🐾 Gestione Cani</h1>
    </header>

    <main>
        <!-- Sezione Cani -->
        <section class="card">
            <h2>I Tuoi Cani</h2>
            <div id="lista-cani">Caricamento...</div>
            <button onclick="mostraFormCane()">+ Aggiungi Cane</button>
            
            <form id="form-cane" class="hidden" onsubmit="salvaCane(event)">
                <input type="text" id="nome-cane" placeholder="Nome" required>
                <input type="text" id="razza-cane" placeholder="Razza">
                <input type="date" id="nascita-cane">
                <input type="text" id="microchip-cane" placeholder="Microchip">
                <button type="submit">Salva Cane</button>
            </form>
        </section>

        <!-- Sezione Scadenze -->
        <section class="card">
            <h2>Prossime Scadenze</h2>
            <div id="lista-scadenze">Caricamento...</div>
            <button onclick="mostraFormScadenza()">+ Aggiungi Scadenza</button>

            <form id="form-scadenza" class="hidden" onsubmit="salvaScadenza(event)">
                <select id="select-cane-scadenza" required>
                    <option value="">Seleziona Cane</option>
                </select>
                <input type="text" id="tipo-scadenza" placeholder="Tipo (es. Vaccino, Antiparassitario)" required>
                <input type="date" id="data-scadenza" required>
                <input type="text" id="incaricato-scadenza" placeholder="Chi se ne occupa?">
                <button type="submit">Salva Scadenza</button>
            </form>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script>
        // Registrazione Service Worker per installazione PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/js/sw.js')
                .then(() => console.log('Service Worker registrato con successo!'))
                .catch(err => console.log('Errore Service Worker:', err));
        }
    </script>
</body>
</html>
