<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Cani</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f8f9fa; padding-top: 20px; }
    .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">🐾 Gestione Cani</h2>
    
    <!-- Sezione Cani -->
    <div class="card p-4 mb-4">
      <h4>I Tuoi Cani</h4>
      <div id="lista-cani" class="list-group my-3">
        <p class="text-muted">Nessun cane presente.</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCane">+ Aggiungi Cane</button>
    </div>

    <!-- Sezione Scadenze -->
    <div class="card p-4">
      <h4>Prossime Scadenze</h4>
      <div id="lista-attivita" class="list-group my-3">
        <p class="text-muted">Nessuna scadenza inserita.</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAttivita">+ Aggiungi Scadenza</button>
    </div>
  </div>

  <!-- Modal Aggiungi Cane -->
  <div class="modal fade" id="modalCane" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Aggiungi Cane</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <form id="formCane">
            <div class="mb-3"><label class="form-label">Nome</label><input type="text" class="form-control" id="nomeCane" required></div>
            <div class="mb-3"><label class="form-label">Razza</label><input type="text" class="form-control" id="razzaCane"></div>
            <button type="submit" class="btn btn-primary w-100">Salva</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Aggiungi Attività -->
  <div class="modal fade" id="modalAttivita" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Aggiungi Scadenza</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <form id="formAttivita">
            <div class="mb-3"><label class="form-label">Descrizione Attività</label><input type="text" class="form-control" id="descAttivita" required></div>
            <button type="submit" class="btn btn-primary w-100">Salva</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/js/sw.js?v=3')
        .then(() => console.log('Service Worker v3 registrato'))
        .catch(err => console.log('Errore SW:', err));
    }
  </script>
</body>
</html>
